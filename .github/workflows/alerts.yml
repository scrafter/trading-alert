name: Trading alerts

on:
  schedule:
    # Every 10 minutes (UTC). GitHub may delay scheduled runs by several minutes under load.
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

# Never run two checks at once, so they can't both send the same alert.
concurrency:
  group: trading-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Alert state from the previous run (which zones were already reported).
      # Each run saves a new cache entry; restore-keys picks the most recent one.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      # No npm install needed: the script has no runtime dependencies.
      - name: Check instruments
        run: node src/index.ts --once
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}
